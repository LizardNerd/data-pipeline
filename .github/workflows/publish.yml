name: Pubblica dataset carburanti

on:
  schedule:
    # Il MIMIT pubblica i file del giorno in mattinata: più passaggi coprono eventuali ritardi.
    # Minuto non tondo: a inizio e metà ora GitHub ritarda o salta più spesso i job programmati.
    - cron: "17 7,10,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Genera dataset
        run: python3 -I build_dataset.py public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
